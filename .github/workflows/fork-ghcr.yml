# Fork-only workflow: builds this fork's source and publishes a linux/amd64
# image to GitHub Container Registry (ghcr.io/<owner>/ovenmediaengine).
#
# Kept in its own file so upstream edits to the docker-image-*.yml workflows
# never conflict with it.

name: Fork Image (GHCR)

on:
  push:
    branches:
      - ssysm
    tags:
      - 'fork-*'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: fork-ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_URL: https://github.com/OvenMediaLabs/OvenMediaEngine.git

jobs:
  build:
    name: Build and push linux/amd64
    # Never run in the upstream repository, only in forks.
    if: github.repository_owner != 'OvenMediaLabs'
    runs-on: ubuntu-22.04
    steps:
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ovenmediaengine" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The fork may lack newer upstream tags; fetch them so `git describe`
      # stamps the binary as e.g. v0.21.0-14-gabc1234.
      # .dockerignore drops .git, so git_info.h has to be generated here.
      - name: Stamp version
        run: |
          git fetch --tags --force "$UPSTREAM_URL" || true
          src/main/update_git_info.sh
          grep OME_GIT_VERSION src/main/git_info.h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: `latest` and `ssysm` for the branch, `sha-abc1234` for every
      # build, and the git tag name (e.g. fork-0.21.0.1) for tag pushes.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/ssysm' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      # USE_LOCAL=true is essential: without it the Dockerfile clones
      # upstream master and your changes never reach the image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            USE_LOCAL=true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
